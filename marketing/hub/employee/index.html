<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<title>Tayla — Marketing Hub</title>
<style>
  html, body { margin:0; padding:0; background:#0A0A0A !important; min-height:100vh; font-family: 'Georgia', serif; color-scheme: dark; }
  #gate {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:2rem;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(212,168,67,0.07) 0%, transparent 70%), #0A0A0A;
  }
  .gate-logo { font-size:2rem; font-weight:900; color:#D4A843; letter-spacing:-0.02em; margin-bottom:0.4rem; }
  .gate-sub { font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(240,234,214,0.3); font-family:monospace; margin-bottom:2.5rem; }
  .gate-box {
    background:#111; border:1px solid rgba(212,168,67,0.2); border-radius:16px;
    padding:2rem 2.5rem; width:100%; max-width:360px; text-align:center;
  }
  .gate-title { font-size:1rem; color:rgba(240,234,214,0.8); margin-bottom:1.5rem; font-style:italic; }
  .gate-input {
    width:100%; padding:0.75rem 1rem; font-family:monospace; font-size:0.9rem;
    background:#0A0A0A; border:1px solid rgba(212,168,67,0.25); border-radius:8px;
    color:#D4A843; outline:none; text-align:center; letter-spacing:0.1em;
    margin-bottom:1rem; transition:border-color 0.2s;
  }
  .gate-input:focus { border-color:#D4A843; }
  .gate-input.error { border-color:#C1440E; animation: shake 0.3s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .gate-btn {
    width:100%; padding:0.75rem; font-family:monospace; font-size:0.78rem;
    letter-spacing:0.14em; text-transform:uppercase;
    background:rgba(212,168,67,0.12); border:1px solid rgba(212,168,67,0.3);
    color:#D4A843; border-radius:8px; cursor:pointer; transition:all 0.2s;
  }
  .gate-btn:hover { background:rgba(212,168,67,0.22); }
  .gate-err { color:#C1440E; font-size:0.75rem; font-family:monospace; margin-top:0.8rem; min-height:1em; }
  #app { display:none; }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-logo">Tayla</div>
  <div class="gate-sub">Marketing Hub · Protected</div>
  <div class="gate-box">
    <div class="gate-title">Enter your access password</div>
    <input class="gate-input" type="password" id="pwInput" placeholder="••••••••••••••" onkeydown="if(event.key==='Enter')unlock()">
    <button class="gate-btn" onclick="unlock()">Unlock →</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>
<div id="app"></div>
<script>
  function unlock() {
    const val = document.getElementById('pwInput').value;
    const inp = document.getElementById('pwInput');
    if (val === 'TaylaLaunch2026') {
      document.getElementById('gate').style.display = 'none';
      const app = document.getElementById('app');
      app.style.display = 'block';
      app.innerHTML = decodeURIComponent(escape(atob(PAYLOAD)));
      // Re-run scripts in the loaded content
      app.querySelectorAll('script').forEach(s => {
        const ns = document.createElement('script');
        ns.textContent = s.textContent;
        document.body.appendChild(ns);
      });
    } else {
      inp.classList.add('error');
      document.getElementById('gateErr').textContent = 'Incorrect password. Try again.';
      setTimeout(() => inp.classList.remove('error'), 400);
      inp.value = '';
    }
  }
</script>
