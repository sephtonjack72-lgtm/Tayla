
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tayla — Blog Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--ink:#111e1e;--paper:#f0f4f3;--paper-2:#e0eae8;--rule:rgba(30,80,80,0.15);--gold:#1a7a8c;--gold-light:#7cc4d0;--green:#1a7a4a;--red:#a83232;--r:10px;--r-sm:6px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:#0d1f1f;color:#fff;min-height:100vh;padding:32px 24px;}
.container{max-width:680px;margin:0 auto;}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:1.3rem;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;margin-bottom:32px;}
.logo-dot{width:8px;height:8px;background:var(--gold-light);border-radius:50%;}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:var(--r);padding:28px;margin-bottom:20px;}
.card-title{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:6px;}
.card-sub{font-size:0.8rem;color:rgba(255,255,255,0.45);margin-bottom:20px;}
.form-label{font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:8px;display:block;}
.form-input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:var(--r-sm);padding:11px 14px;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:0.9rem;outline:none;margin-bottom:16px;transition:border-color 0.15s;}
.form-input:focus{border-color:var(--gold-light);}
.form-input::placeholder{color:rgba(255,255,255,0.25);}
.form-select{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:var(--r-sm);padding:11px 14px;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:0.9rem;outline:none;margin-bottom:16px;appearance:none;}
.form-select option{background:#1a3535;color:#fff;}
.drop-zone{border:2px dashed rgba(255,255,255,0.2);border-radius:var(--r);padding:36px 24px;text-align:center;cursor:pointer;transition:all 0.15s;margin-bottom:16px;}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--gold-light);background:rgba(124,196,208,0.05);}
.drop-icon{font-size:2.2rem;margin-bottom:10px;}
.drop-text{font-size:0.85rem;color:rgba(255,255,255,0.5);line-height:1.6;}
.drop-text strong{color:var(--gold-light);}
.btn{width:100%;background:var(--gold);color:#fff;border:none;border-radius:var(--r-sm);padding:13px;font-family:'IBM Plex Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;transition:opacity 0.15s;margin-bottom:10px;}
.btn:hover{opacity:0.88;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-ghost{width:100%;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);border-radius:var(--r-sm);padding:11px;font-family:'IBM Plex Sans',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.15s;margin-bottom:10px;}
.btn-ghost:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
.btn-danger{background:rgba(168,50,50,0.3);border:1px solid rgba(168,50,50,0.4);color:#e08080;}
.btn-danger:hover{background:rgba(168,50,50,0.5);}
.feedback{font-size:0.8rem;padding:10px 14px;border-radius:var(--r-sm);margin-bottom:12px;display:none;}
.feedback.success{background:rgba(26,122,74,0.2);color:#7ec89a;border:1px solid rgba(26,122,74,0.3);}
.feedback.error{background:rgba(168,50,50,0.2);color:#e08080;border:1px solid rgba(168,50,50,0.3);}
.feedback.info{background:rgba(26,122,140,0.2);color:var(--gold-light);border:1px solid rgba(26,122,140,0.3);}
.preview-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:var(--r-sm);padding:16px;max-height:200px;overflow-y:auto;font-size:0.8rem;color:rgba(255,255,255,0.6);line-height:1.6;margin-bottom:16px;display:none;}
.posts-list{display:flex;flex-direction:column;gap:10px;}
.post-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:var(--r-sm);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.post-item-info{flex:1;min-width:0;}
.post-item-title{font-size:0.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post-item-meta{font-size:0.72rem;color:rgba(255,255,255,0.4);margin-top:3px;}
.post-item-tag{font-size:0.62rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold-light);background:rgba(124,196,208,0.15);padding:2px 7px;border-radius:8px;}
.post-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-sm{padding:5px 12px;font-size:0.75rem;border-radius:var(--r-sm);border:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
.btn-view{background:rgba(26,122,140,0.2);color:var(--gold-light);}
.btn-del{background:rgba(168,50,50,0.2);color:#e08080;}
/* Login */
#login-card{display:block;}
#main-content{display:none;}
</style>
</head>
<body>
<div class="container">
  <a class="logo" href="/blog/"><div class="logo-dot"></div>Tayla Blog</a>

  <!-- LOGIN -->
  <div class="card" id="login-card">
    <div class="card-title">Blog Admin</div>
    <div class="card-sub">Owner access only</div>
    <label class="form-label">Password</label>
    <input class="form-input" type="password" id="pw-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" onclick="unlock()">Continue →</button>
    <div class="feedback error" id="pw-error">Incorrect password.</div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content">

    <!-- UPLOAD NEW POST -->
    <div class="card">
      <div class="card-title">Upload New Post</div>
      <div class="card-sub">Upload a Word document (.docx) — it will be converted and published automatically.</div>

      <label class="form-label">Post Title</label>
      <input class="form-input" type="text" id="post-title" placeholder="e.g. How to Budget on a Casual Wage in Australia">

      <label class="form-label">Author</label>
      <input class="form-input" type="text" id="post-author" placeholder="Jack Sephton" value="Jack Sephton">

      <label class="form-label">Category / Tag</label>
      <select class="form-select" id="post-tag">
        <option value="">— No category —</option>
        <option value="Tax">Tax</option>
        <option value="Budgeting">Budgeting</option>
        <option value="Saving">Saving</option>
        <option value="Investing">Investing</option>
        <option value="HECS">HECS</option>
        <option value="Superannuation">Superannuation</option>
        <option value="News">News</option>
      </select>

      <label class="form-label">Word Document (.docx)</label>
      <div class="drop-zone" id="drop-zone"
        ondragover="event.preventDefault();this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')"
        ondrop="handleDrop(event)"
        onclick="document.getElementById('file-input').click()">
        <div class="drop-icon">📄</div>
        <div class="drop-text"><strong>Click to upload</strong> or drag and drop<br>.docx files only</div>
      </div>
      <input type="file" id="file-input" accept=".docx" style="display:none" onchange="handleFile(this.files[0])">

      <div class="preview-box" id="preview-box"></div>
      <div class="feedback" id="upload-feedback"></div>

      <button class="btn" id="publish-btn" onclick="publishPost()" disabled>Publish Post</button>
    </div>

    <!-- EXISTING POSTS -->
    <div class="card">
      <div class="card-title">Published Posts</div>
      <div class="card-sub">Manage your existing posts.</div>
      <div class="feedback" id="manage-feedback"></div>
      <div class="posts-list" id="posts-list"></div>
      <div style="margin-top:16px">
        <button class="btn-ghost btn-danger" onclick="clearAllPosts()">🗑 Delete All Posts</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script>
const UPLOAD_PASSWORD = 'tayla-blog-2026';
const STORAGE_KEY     = 'tayla_blog_posts';

let pendingContent = null;

function unlock() {
  if (document.getElementById('pw-input').value === UPLOAD_PASSWORD) {
    document.getElementById('login-card').style.display  = 'none';
    document.getElementById('main-content').style.display = 'block';
    renderPostsList();
  } else {
    const err = document.getElementById('pw-error');
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
  }
}

function getPosts() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function savePosts(posts) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
}

function handleFile(file) {
  if (!file || !file.name.endsWith('.docx')) {
    showFeedback('upload-feedback', 'error', '✗ Please upload a .docx file.');
    return;
  }
  showFeedback('upload-feedback', 'info', '⏳ Converting ' + file.name + '...');
  document.getElementById('drop-zone').querySelector('.drop-text').innerHTML =
    `<strong>${file.name}</strong><br>Converting...`;

  const reader = new FileReader();
  reader.onload = e => {
    mammoth.convertToHtml({ arrayBuffer: e.target.result })
      .then(result => {
        pendingContent = result.value;
        const preview = document.getElementById('preview-box');
        preview.innerHTML = pendingContent;
        preview.style.display = 'block';
        document.getElementById('publish-btn').disabled = false;
        showFeedback('upload-feedback', 'success', '✓ Document converted — fill in the details above and click Publish.');
        document.getElementById('drop-zone').querySelector('.drop-text').innerHTML =
          `<strong>${file.name}</strong> ready to publish`;
      })
      .catch(err => {
        showFeedback('upload-feedback', 'error', '✗ Conversion failed: ' + err.message);
      });
  };
  reader.readAsArrayBuffer(file);
}

function publishPost() {
  const title  = document.getElementById('post-title').value.trim();
  const author = document.getElementById('post-author').value.trim() || 'Tayla Team';
  const tag    = document.getElementById('post-tag').value;

  if (!title) {
    showFeedback('upload-feedback', 'error', '✗ Please enter a post title.');
    return;
  }
  if (!pendingContent) {
    showFeedback('upload-feedback', 'error', '✗ Please upload a document first.');
    return;
  }

  // Extract excerpt from first paragraph
  const tmp = document.createElement('div');
  tmp.innerHTML = pendingContent;
  const firstP = tmp.querySelector('p');
  const excerpt = firstP ? firstP.textContent.slice(0, 160) + '…' : '';

  const post = {
    id:      Date.now().toString(),
    title,
    author,
    tag,
    excerpt,
    content: pendingContent,
    date:    new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' }),
  };

  const posts = getPosts();
  posts.unshift(post); // newest first
  savePosts(posts);

  showFeedback('upload-feedback', 'success', '✓ "' + title + '" published successfully!');
  renderPostsList();

  // Reset form
  document.getElementById('post-title').value = '';
  document.getElementById('post-tag').value   = '';
  document.getElementById('preview-box').style.display = 'none';
  document.getElementById('drop-zone').querySelector('.drop-text').innerHTML =
    '<strong>Click to upload</strong> or drag and drop<br>.docx files only';
  document.getElementById('file-input').value = '';
  document.getElementById('publish-btn').disabled = true;
  pendingContent = null;
}

function deletePost(id) {
  if (!confirm('Delete this post? This cannot be undone.')) return;
  savePosts(getPosts().filter(p => p.id !== id));
  renderPostsList();
  showFeedback('manage-feedback', 'success', '✓ Post deleted.');
}

function clearAllPosts() {
  if (!confirm('Delete ALL posts? This cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderPostsList();
  showFeedback('manage-feedback', 'success', '✓ All posts deleted.');
}

function renderPostsList() {
  const posts = getPosts();
  const list  = document.getElementById('posts-list');
  if (posts.length === 0) {
    list.innerHTML = '<p style="font-size:0.82rem;color:rgba(255,255,255,0.35);text-align:center;padding:20px">No posts published yet.</p>';
    return;
  }
  list.innerHTML = posts.map(p => `
    <div class="post-item">
      <div class="post-item-info">
        <div class="post-item-title">${p.title}</div>
        <div class="post-item-meta">${p.author} · ${p.date} ${p.tag ? `· <span class="post-item-tag">${p.tag}</span>` : ''}</div>
      </div>
      <div class="post-actions">
        <button class="btn-sm btn-view" onclick="window.open('/blog/post/?id=${p.id}','_blank')">View</button>
        <button class="btn-sm btn-del" onclick="deletePost('${p.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function showFeedback(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'feedback ' + type;
  el.style.display = 'block';
  el.textContent = msg;
}
</script>
</body>
</html>
